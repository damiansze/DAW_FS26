[project]
name = "daw-fs26"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "pytest-cov",
    "ruff",
]

# Damit "src/" Layout für Tests sauber funktioniert
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", "notebooks"]

[tool.ruff.lint]
# Baseline für Clean Code
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # wenn du line-length nicht strikt erzwingen willst

[tool.ruff.lint.isort]
known-first-party = ["myproj"]